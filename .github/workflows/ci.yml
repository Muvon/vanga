name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  rust:
    name: Rust CI
    uses: muvon/ci-workflow/.github/workflows/rust-ci.yml@master
    with:
      # MSRV pinned in Cargo.toml (rust-version = 1.87)
      toolchain: '1.87.0'
      # ONNX Runtime issues force --no-default-features across all cargo jobs
      feature-flags: '--no-default-features'
      setup-protoc: true
      test-script: 'cargo test --verbose --no-default-features'
      doc: false
      # Shared tarpaulin job uploads to Codecov without a token, so nothing
      # ever lands. Replaced by the local `coverage` job below, which publishes
      # the report on the run page and as an artifact (same as octomind).
      coverage: false

  # Source-based coverage via the shared llvm-cov workflow: run summary,
  # lcov artifact, and a shields.io badge on the orphan `badges` branch.
  coverage:
    name: Coverage Report
    permissions:
      contents: write # push the badge JSON to the `badges` branch
    uses: muvon/ci-workflow/.github/workflows/rust-coverage.yml@master
    with:
      toolchain: '1.87.0'
      feature-flags: '--no-default-features'
      setup-protoc: true
      ignore-filename-regex: '_test\.rs$|(^|/)tests/'

  brief:
    uses: muvon/ci-workflow/.github/workflows/brief.yml@master
    secrets: inherit
